# Performance Regression Testing Workflow
# Runs on every PR to detect performance regressions

name: Performance Tests

on:
  pull_request:
    branches: [ main ]
    paths:
      - 'backend/**/*.go'
      - '.github/workflows/performance.yml'
      - '.github/scripts/comment-benchmark.js'
  push:
    branches: [ main ]
    paths:
      - 'backend/**/*.go'

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: performance-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  performance-tests:
    name: Performance Regression Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache-dependency-path: backend/go.sum

      - name: Run performance regression tests
        working-directory: backend
        run: |
          echo "Running performance regression tests..."
          go test -v -run TestPerformanceRegression ./internal/color/
          
      - name: Run benchmarks
        working-directory: backend
        shell: bash
        run: |
          echo "Running benchmarks..."
          go test -run='^$' -bench=BenchmarkExtractColors -benchmem -benchtime=5s ./internal/color/ | tee benchmark-results.txt
          
      - name: Upload benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: backend/benchmark-results.txt
          retention-days: 30

      - name: Comment benchmark results on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const comment = require('./.github/scripts/comment-benchmark.js');
            await comment({ github, context });
