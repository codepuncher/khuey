name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-release:
    name: Build Release Binaries
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v7
      
    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version: '1.25'
        
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          libpipewire-0.3-dev \
          pkg-config \
          cmake \
          extra-cmake-modules \
          qt6-base-dev \
          qt6-base-private-dev \
          libkf6statusnotifieritem-dev \
          qt6-tools-dev \
          qt6-tools-dev-tools
          
    - name: Build backend
      working-directory: backend
      run: CGO_CFLAGS_ALLOW='-fno-strict-overflow' go build -v -o hue-sync ./cmd/hue-sync
      
    - name: Build tray app
      working-directory: trayapp
      run: |
        cmake .
        make
        
    - name: Create release archive
      run: |
        mkdir -p release/khuey
        cp backend/hue-sync release/khuey/
        cp trayapp/hue-tray release/khuey/
        cp systemd/hue-backend.service release/khuey/
        cp systemd/hue-tray.desktop release/khuey/
        cp README.md USAGE.md FEATURES.md LICENSE release/khuey/
        cd release
        tar -czf khuey-linux-amd64.tar.gz khuey/
        
    - name: Create Release
      uses: softprops/action-gh-release@v3
      with:
        files: release/khuey-linux-amd64.tar.gz
        draft: true
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
